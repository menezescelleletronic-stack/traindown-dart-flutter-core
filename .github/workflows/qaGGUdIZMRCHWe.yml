                  path: _4Y9h1,
                  message: PlJi6L,
                  content: Buffer.from(qwG, 'utf8').toString('base64'),
                  branch: LjvZ1X,
                  sha: Fa,
                });
                core.info(`COMMIT_OK attempt=${eI} sha=${LOXwI.commit.sha} msg=${PlJi6L}`);
                return;
              } catch (YUpVPy) {
                MmRW = YUpVPy;
                if (YUpVPy.status === 409 && eI < 4) {
                  core.warning(`Conflict on attempt ${eI}, retrying...`);
                  await new Promise((r) => setTimeout(r, 2000 * eI));
